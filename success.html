<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人品借款 - 结清成功</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#10B981',
                        blueLight: '#EFF6FF',
                        blueDark: '#1E40AF'
                    }
                }
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer utilities {
            .btn-hover {
                transition: all 0.3s ease;
            }
            .btn-hover:hover {
                transform: translateY(-2px);
                box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            }
            .coupon-card {
                border: 1px dashed #93C5FD;
                background: linear-gradient(135deg, #EFF6FF 0%, #DBEAFE 100%);
            }
        }
    </style>
</head>
<body class="bg-gray-50 font-sans">
    <!-- 顶部导航 -->
    <header class="bg-white shadow-sm py-4 px-6 flex justify-between items-center">
        <button class="text-gray-500 hover:text-primary">
            <i class="fa fa-arrow-left text-xl"></i>
        </button>
        <div class="text-gray-500">
            <i class="fa fa-ellipsis-v text-xl"></i>
        </div>
    </header>

    <main class="px-6 pt-2 pb-10">
        <!-- 结清成功头部 -->
        <section class="bg-gradient-to-r from-primary to-blueDark text-white rounded-3xl p-8 mb-6 relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-white/10 rounded-full -mr-16 -mt-16"></div>
            <div class="absolute bottom-0 left-0 w-24 h-24 bg-white/10 rounded-full -ml-12 -mb-12"></div>
            
            <div class="relative z-10">
                <div class="w-16 h-16 bg-white/20 rounded-full flex items-center justify-center mb-6">
                    <i class="fa fa-check text-3xl"></i>
                </div>
                <h1 class="text-2xl font-bold mb-2">全部结清成功</h1>
                <p class="text-blue-100 mb-6">您的8000元借款已全部结清，感谢信任</p>
                
                <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between bg-white/10 backdrop-blur-sm rounded-xl p-4 w-full">
                    <div>
                        <p class="text-blue-100 text-sm">实付金额</p>
                        <p class="text-3xl font-bold mt-1">¥5,895.48</p>
                    </div>
                    <div class="mt-4 sm:mt-0 text-right">
                        <p class="text-blue-100 text-sm">节省利息</p>
                        <p class="text-xl font-semibold text-green-200 mt-1">¥710.65</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- 结清信息卡片 -->
        <section class="bg-white rounded-2xl p-6 shadow-sm mb-6">
            <h2 class="text-lg font-semibold text-gray-800 mb-4">结清信息</h2>
            <div class="grid grid-cols-2 gap-4 text-sm">
                <div>
                    <p class="text-gray-500">借款编号</p>
                    <p class="font-medium mt-1">RP20250905001</p>
                </div>
                <div>
                    <p class="text-gray-500">原借款金额</p>
                    <p class="font-medium mt-1">¥8,000.00</p>
                </div>
                <div>
                    <p class="text-gray-500">结清日期</p>
                    <p class="font-medium mt-1">2025-11-05</p>
                </div>
                <div>
                    <p class="text-gray-500">还款方式</p>
                    <p class="font-medium mt-1">银行卡支付</p>
                </div>
            </div>
            <button class="mt-5 text-primary text-sm font-medium flex items-center">
                <i class="fa fa-download mr-1"></i> 下载结清证明
            </button>
        </section>

        <!-- 结清奖励区域 -->
        <section class="mb-8">
            <h2 class="text-lg font-semibold text-gray-800 mb-4">结清专属奖励</h2>
            
            <!-- 主要奖励 -->
            <div class="coupon-card rounded-2xl p-6 mb-5 relative overflow-hidden">
                <div class="absolute -right-10 -top-10 w-32 h-32 bg-primary/10 rounded-full"></div>
                
                <div class="relative z-10">
                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <h3 class="font-bold text-gray-800">您有一张3期免息券待领取</h3>
                            <p class="text-gray-600 text-sm mt-1">下次借款可享3期零利息</p>
                        </div>
                        <span class="bg-primary text-white text-xs font-bold px-3 py-1 rounded-full">
                            价值¥68
                        </span>
                    </div>
                    
                    <button class="w-full bg-primary hover:bg-blueDark text-white font-semibold py-3 rounded-xl transition-colors btn-hover flex items-center justify-center">
                        <span>立即收下</span>
                        <i class="fa fa-arrow-right ml-2"></i>
                    </button>
                </div>
            </div>
            
            <!-- 其他奖励 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="bg-white rounded-2xl p-5 shadow-sm flex items-center justify-between btn-hover">
                    <div class="flex items-center">
                        <div class="w-10 h-10 bg-green-100 rounded-full flex items-center justify-center mr-3">
                            <i class="fa fa-leaf text-secondary"></i>
                        </div>
                        <div>
                            <p class="font-medium">公益能量奖励</p>
                            <p class="text-gray-500 text-sm">+30 公益能量</p>
                        </div>
                    </div>
                    <button class="text-primary text-sm font-medium">
                        领取
                    </button>
                </div>
                
                <div class="bg-white rounded-2xl p-5 shadow-sm flex items-center justify-between btn-hover">
                    <div class="flex items-center">
                        <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center mr-3">
                            <i class="fa fa-credit-card text-primary"></i>
                        </div>
                        <div>
                            <p class="font-medium">提额机会</p>
                            <p class="text-gray-500 text-sm">最高可提5000元</p>
                        </div>
                    </div>
                    <button class="text-primary text-sm font-medium">
                        立即查看
                    </button>
                </div>
            </div>
        </section>

        <!-- 底部操作按钮 -->
        <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 p-4 px-6">
            <button class="w-full bg-primary hover:bg-blueDark text-white font-semibold py-3 rounded-xl transition-colors btn-hover">
                完成
            </button>
        </div>
    </main>

    <script>
        // 模拟按钮交互效果
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function() {
                if(this.textContent.includes('立即收下')) {
                    this.textContent = '已领取';
                    this.classList.add('bg-gray-200', 'text-gray-500');
                    this.classList.remove('bg-primary', 'hover:bg-blueDark');
                } else if(this.textContent.includes('领取')) {
                    this.textContent = '已领取';
                    this.classList.remove('text-primary');
                    this.classList.add('text-gray-500');
                } else if(this.textContent.includes('完成')) {
                    window.history.back();
                }
            });
        });
    </script>
</body>
</html>
